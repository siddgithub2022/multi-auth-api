services:
  - type: web
    name: multi-auth-api
    env: node
    plan: free
    buildCommand: npm install && cd server && npm install
    startCommand: node server/server.js
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: BASE_URL
        value: https://multi-auth-api.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
    healthCheckPath: /health
    autoDeploy: true
